<!doctype html>
<html
    lang="{{ language }}"
    dir="{{ direction }}"
    data-theme-preference="{{ appearance }}"
    data-authenticated="{{ 'true' if current_user.is_authenticated else 'false' }}"
>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4efe3">

    <title>{% block title %}ILI pika{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='pika-mark.svg') }}" type="image/svg+xml">

    <script>
        (function () {
            const root = document.documentElement;
            const allowedThemes = ["system", "light", "dark"];
            let localTheme = "system";
            try {
                localTheme = localStorage.getItem("ili-pika-theme") || "system";
            } catch (error) {
                localTheme = "system";
            }
            if (!allowedThemes.includes(localTheme)) {
                localTheme = "system";
            }
            const stored = root.dataset.authenticated === "true"
                ? root.dataset.themePreference
                : localTheme;
            const dark = stored === "dark" || (
                stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches
            );
            root.dataset.theme = dark ? "dark" : "light";
        }());
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">

    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">{{ t('Skip to content') }}</a>

    {% block content %}{% endblock %}

    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
